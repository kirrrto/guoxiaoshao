name: Verify source and release candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked cloud function SDKs
        shell: bash
        run: |
          for function in gxs_api gxs_monitor cloudbase_auth; do
            npm ci --prefix "cloudfunctions/$function" --ignore-scripts --no-audit --no-fund
          done
      - name: Verify generated monitor dependency closure
        run: node tools/build-monitor.mjs --check
      - name: Run offline tests
        run: npm test
      - name: Check source encoding and syntax
        run: npm run check
      - name: Check release candidate
        run: node tools/release/check.mjs
