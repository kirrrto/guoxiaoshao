name: Verify source and release candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for required browser regressions
        run: npx --no-install playwright install --with-deps chromium
      - name: Install locked cloud function SDKs
        shell: bash
        run: |
          for function in gxs_api gxs_monitor cloudbase_auth; do
            npm ci --prefix "cloudfunctions/$function" --ignore-scripts --no-audit --no-fund
          done
      - name: Verify generated monitor dependency closure
        run: node tools/build-monitor.mjs --check
      - name: Run offline tests
        shell: bash
        run: |
          mkdir -p output
          npm test 2>&1 | tee output/ci-tests.log
      - name: Check source encoding and syntax
        run: npm run check
      - name: Verify current mini program UI in offline Chromium
        shell: bash
        run: |
          node tools/ui-preview/build.mjs --v343-only --out output/ci-ui
          node tools/ui-preview/check-layout.mjs output/ci-ui
          node tools/ui-preview/check-layout.mjs output/ci-ui --dark
          node tools/ui-preview/check-native-tabs.mjs output/ci-ui
          node tools/ui-preview/check-native-tabs.mjs output/ci-ui --dark
          node tools/ui-preview/check-picker-alignment.mjs output/ci-ui
          node tools/ui-preview/check-theme-colors.mjs output/ci-ui output/ci-colors
          node tools/ui-preview/check-theme-colors.mjs output/ci-ui output/ci-colors --dark
      - name: Check release candidate
        run: node tools/release/check.mjs --out output/ci-release.json
      - name: Preserve verification evidence even when release is blocked
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verification-${{ github.sha }}
          path: output/ci-*
          retention-days: 14
          if-no-files-found: warn
